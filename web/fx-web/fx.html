<title>Octavio FX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500&display=swap">
<style>
/* Layout: one hardware panel, sections in a wrapping grid, keyboard docked at the bottom. Single deliberate "aluminium" look. */
:root{
  --case:#26282b; --panel:#dcd8cf; --panel2:#cbc6bb; --ink:#1d1d1b; --soft:#5d5b55;
  --grey:#a3a39e; --blue:#3e6bb0; --osc:#d4782a; --gate:#2f64a8; --func:#b5372f; --mod:#4b8640; --seq:#c99a22; --led:#ff4a2a;
  --f-label:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--case);color:var(--panel)}
body{font-family:var(--f-body);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:10px}
.brand{font-family:var(--f-label);font-weight:700;font-size:26px;letter-spacing:.06em}
.brand b{color:var(--osc)}
.tabs{display:flex;gap:6px}
button{font-family:var(--f-label);font-weight:700;letter-spacing:.08em;font-size:14px;border:1.5px solid var(--ink);background:var(--panel2);color:var(--ink);border-radius:4px;padding:7px 14px;cursor:pointer}
button.on{background:var(--ink);color:var(--panel);border-color:var(--panel2)}
button:focus-visible,select:focus-visible,.knob:focus-visible{outline:2px solid var(--osc);outline-offset:2px}
#start{background:var(--osc);color:#fff;border-color:var(--osc)}
#start.running{background:var(--mod);border-color:var(--mod)}
.grow{flex:1}
.page{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));padding-bottom:178px}
.sec{background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;min-width:0}
.sec h2{margin:0;font-family:var(--f-label);font-size:14px;letter-spacing:.12em;color:#fff;padding:4px 10px}
.sec .in{padding:8px;display:flex;flex-wrap:wrap;gap:6px 4px;align-items:flex-start}
.wide{grid-column:1/-1}
.grp{display:flex;flex-direction:column;gap:2px;min-width:0}
.grp>.cap{font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--soft);padding-left:4px}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}
.ctl{width:70px;display:flex;flex-direction:column;align-items:center;font-family:var(--f-label)}
.ctl .nm{font-weight:700;font-size:11px;letter-spacing:.06em;text-align:center;line-height:1.1;margin-top:2px}
.ctl .vl{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
.knob{width:52px;height:52px;border-radius:50%;position:relative;touch-action:none;cursor:ns-resize;box-shadow:1px 3px 3px rgba(0,0,0,.25)}
.knob::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:17px;margin-left:-1.5px;background:#fff;border-radius:2px}
.knob .cap{position:absolute;inset:8px;border-radius:50%;box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}
.sel{width:100%;min-width:0}
.ctl.sl{width:96px}
select{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.04em;background:var(--ink);color:#fff;border:0;border-radius:3px;padding:5px 4px;width:100%}
.tog{display:flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:700;font-size:11.5px;letter-spacing:.06em;cursor:pointer;padding:4px}
.tog i{width:16px;height:16px;border-radius:3px;background:var(--ink);display:grid;place-items:center}
.tog i::after{content:"";width:7px;height:7px;border-radius:50%;background:#5a1a10}
.tog.on i::after{background:var(--led);box-shadow:0 0 6px var(--led)}
.col{display:flex;flex-direction:column;gap:4px;padding:4px;border-right:1px dashed var(--panel2);min-width:0}
.col:last-child{border-right:0}
.colhead{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-label);font-weight:700;font-size:15px}
.meter{width:30px;height:7px;background:var(--ink);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--led)}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
.cols .ctl{width:auto}
@media (max-width:520px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}.col:nth-child(2){border-right:0}}
.mat{display:grid;grid-template-columns:22px minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,1fr);gap:5px 6px;align-items:center;width:100%;font-family:var(--f-label);font-weight:700;font-size:12px}
.bar{height:24px;background:var(--panel2);border:1px solid rgba(0,0,0,.4);border-radius:3px;position:relative;touch-action:none;cursor:ew-resize}
.bar i{position:absolute;top:2px;bottom:2px;background:var(--blue)}
.bar i.neg{background:var(--func)}
.bar::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(0,0,0,.35)}
.steps{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;width:100%;height:170px}
.step{background:var(--panel2);border:1px solid rgba(0,0,0,.45);border-radius:3px;position:relative;touch-action:none}
.step:nth-child(4n+1){margin-left:2px}
.step i{position:absolute;left:2px;right:2px;background:var(--blue)}
.step i.neg{background:var(--func)}
.step::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.35)}
.step.now{border:2px solid var(--led)}
.step.uni::before{display:none}
.seqbtns{display:flex;flex-wrap:wrap;gap:5px;width:100%}
.hint{font-family:var(--f-label);font-size:12px;color:var(--soft);width:100%}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--case);border-top:1px solid #000;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:5}
.kbtools{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--panel)}
.kb{position:relative;height:118px;display:flex;touch-action:none}
.kb .w{flex:1;background:#f2efe8;border:1px solid #000;border-radius:0 0 4px 4px;margin-right:1px}
.kb .b{position:absolute;top:0;height:62%;background:#151515;border:1px solid #000;border-radius:0 0 3px 3px;z-index:2}
.kb .down{background:var(--osc)!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="brand">OCTAVIO <b>VACT</b></div>
  <button id="start">START AUDIO</button>
  <div class="tabs" role="tablist">
    <button class="on" data-page="voice">VOICE</button><button data-page="spectra">SPECTRA</button><button data-page="mod">MOD</button><button data-page="seq">SEQ</button>
  </div>
  <div class="grow"></div>
  <div id="masterSlot"></div>
</header>

<main>
  <section class="page" id="voice"></section>
  <section class="page" id="spectra" hidden></section>
  <section class="page" id="mod" hidden></section>
  <section class="page" id="seq" hidden></section>
</main>

<footer>
  <div class="kbtools">
    <button id="octDn">OCT −</button><button id="octUp">OCT +</button><span id="octLbl">C3</span>
    <span style="font-weight:500;opacity:.7">iPhone silencieux? Désactive le mode silencieux.</span>
    <div class="grow"></div>
    <span class="tog" id="holdTog"><i></i>HOLD</span>
  </div>
  <div class="kb" id="kb"></div>
</footer>

function startFallback(){

  const sc=document.createElement('script');

  const sp=ctx.createScriptProcessor(1024,0,2);

startBtn.onclick=async()=>{
  if(booting)return;
  try{
    if(!ctx){
      booting=true;

      try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      ctx.resume();                                   // must happen inside the tap, before any await
      const b=ctx.createBuffer(1,1,22050),src=ctx.createBufferSource();src.buffer=b;src.connect(ctx.destination);src.start(0);
      label('LOADING…');
      let ok=false;
      if(ctx.audioWorklet){
        try{
          const url=URL.createObjectURL(new Blob([WORKLET],{type:'application/javascript'}));
          await Promise.race([ctx.audioWorklet.addModule(url),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),2500))]);
          node=new AudioWorkletNode(ctx,'vact',{numberOfInputs:0,outputChannelCount:[2],processorOptions:{IDX,D,DSTP,P:Array.from(P)}});
          node.connect(ctx.destination);node.port.onmessage=e=>meters(e.data);ok=true;

      booting=false;
      label(ctx.state==='running'?'AUDIO ON':'TAP TO ENABLE',ctx.state==='running');

    }

    else{await ctx.resume();label(ctx.state==='running'?'AUDIO ON':'TAP TO ENABLE',ctx.state==='running')}

micB.onclick=async()=>{try{await ensureCtx();const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});useInput(ctx.createMediaStreamSource(st),'Microphone / line in')}
  catch(e){inMsg.textContent='The microphone is blocked here. Open the installed version in a browser to use it, or load a file.'}};
const M=document.getElementById('mod');

s=section(M,'LFO / SAMPLE & HOLD','var(--mod)',true);
for(let i=0;i<4;i++)grp(s,null,[knob('l'+i+'rate'),select('l'+i+'shape')]);
grp(s,null,[knob('shrate'),knob('shsm',true)]);grp(s,null,[knob('sh2rate'),knob('sh2sm',true)]);
s=section(M,'MODULATION MATRIX — ANY SOURCE TO ANY PARAMETER','var(--mod)',true);
const mt=el('div','mat');s.appendChild(mt);
['#','SOURCE','DESTINATION','AMOUNT'].forEach(t=>mt.appendChild(el('div','cap',t)));
for(let m=0;m<8;m++){mt.appendChild(el('div',null,m+1));const a=select('m'+m+'src'),b=select('m'+m+'dst');[a,b].forEach(x=>{x.querySelector('.nm').remove();x.style.width='auto'});mt.append(a,b,bar('m'+m+'amt'))}

const S=document.getElementById('seq');
s=section(S,'STEP SEQUENCERS — 6 × 16 STEPS (1/16)','var(--seq)',true);
const sb=el('div','seqbtns');s.appendChild(sb);
const seqRows=[],seqBtns=[],stepEls=[];
for(let q=0;q<6;q++){const b=el('button',null,'SEQ '+(q+1));b.onclick=()=>pickSeq(q);sb.appendChild(b);seqBtns.push(b)}
const clr=el('button',null,'CLEAR'),rnd=el('button',null,'RANDOM');sb.append(clr,rnd);
for(let q=0;q<6;q++){const w=el('div','grp');w.style.width='100%';const st=el('div','steps');const arr=[];
  for(let k=0;k<16;k++){const b=bar('s'+q+'_'+k,true);st.appendChild(b);arr.push(b)}stepEls.push(arr);
  const r=el('div','row');r.append(select('s'+q+'dst'),knob('s'+q+'amt',true));w.append(st,r);s.appendChild(w);seqRows.push(w)}
const tempoRow=el('div','row');tempoRow.appendChild(knob('bpm'));s.appendChild(tempoRow);
s.appendChild(el('div','hint','Drag a step up (blue) or down (red). Double-tap to reset. Pick a destination for each sequencer, or use it as a source in the MOD matrix. Any non-zero step also fires a function generator whose TRIG is set to this sequencer.'));
let curSeq=0;function pickSeq(q){curSeq=q;seqRows.forEach((r,i)=>r.hidden=i!==q);seqBtns.forEach((b,i)=>b.classList.toggle('on',i===q))}
clr.onclick=()=>{for(let k=0;k<16;k++)setP(IDX['s'+curSeq+'_'+k],0)};
rnd.onclick=()=>{for(let k=0;k<16;k++)setP(IDX['s'+curSeq+'_'+k],Math.random()<.35?0:Math.random()*2-1)};
pickSeq(0);
let lastStep=-1;
function meters(m){envM.firstChild.style.width=(m.env*100)+'%';slotEls.forEach((S,q)=>{const v=S.cur;S.led.classList.toggle('on',v>0&&m.mix[q]>.01)});
  if(m.step!==lastStep){stepEls.forEach(a=>a.forEach((e,k)=>e.classList.toggle('now',k===m.step)));lastStep=m.step}}
rebuildPages();refreshSlots();refreshAll();

window.__fxUseInput=useInput;window.__fxReorder=reorder;window.__ccOrder=__ccOrder;window.__ccHint=__ccHint;if(window.__midiReady)midiBuild();
// ===================== Keyboard =====================
const kb=document.getElementById('kb');let oct=48,hold=false;const down=new Map();
const holdT=document.getElementById('holdTog');holdT.onclick=()=>{hold=!hold;holdT.classList.toggle('on',hold);if(!hold){down.forEach((n,pid)=>{});releaseAll()}};
function releaseAll(){kb.querySelectorAll('.down').forEach(k=>k.classList.remove('down'));if(node)node.port.postMessage({t:'alloff'});down.clear()}
function buildKb(){kb.innerHTML='';const whites=[0,2,4,5,7,9,11],blacks=[1,3,6,8,10];const nW=window.innerWidth<600?10:15;let wi=0;const keys=[];
  for(let n=0;wi<nW;n++){const pc=n%12;if(whites.includes(pc)){const k=el('div','w');k.dataset.n=oct+n;kb.appendChild(k);keys.push({k,wi});wi++}}
  const ww=100/nW;wi=0;
  for(let n=0;wi<nW;n++){const pc=n%12;if(whites.includes(pc)){wi++;continue}if(blacks.includes(pc)){const k=el('div','b');k.dataset.n=oct+n;k.style.left=(wi*ww-ww*.32)+'%';k.style.width=(ww*.64)+'%';kb.appendChild(k)}}
  document.getElementById('octLbl').textContent='C'+(oct/12-1)}
function keyAt(x,y){const e=document.elementFromPoint(x,y);return e&&e.dataset&&e.dataset.n?e:null}
kb.addEventListener('pointerdown',e=>{e.preventDefault();const k=keyAt(e.clientX,e.clientY);if(!k)return;const n=+k.dataset.n;
  if(hold&&k.classList.contains('down')){k.classList.remove('down');noteOff(n);return}
  if(hold){releaseAll()}
  down.set(e.pointerId,k);k.classList.add('down');noteOn(n)});
kb.addEventListener('pointermove',e=>{if(!down.has(e.pointerId)||hold)return;const k=keyAt(e.clientX,e.clientY),old=down.get(e.pointerId);
  if(k&&k!==old){old.classList.remove('down');noteOff(+old.dataset.n);k.classList.add('down');noteOn(+k.dataset.n);down.set(e.pointerId,k)}});
const up=e=>{const k=down.get(e.pointerId);if(!k)return;if(!hold){k.classList.remove('down');noteOff(+k.dataset.n);down.delete(e.pointerId)}};
['pointerup','pointercancel','pointerleave'].forEach(t=>kb.addEventListener(t,up));
document.getElementById('octDn').onclick=()=>{if(oct>24){releaseAll();oct-=12;buildKb()}};
document.getElementById('octUp').onclick=()=>{if(oct<84){releaseAll();oct+=12;buildKb()}};
// computer keyboard: A W S E D F T G Y H U J K
const KM='awsedftgyhujk';const kdown=new Set();
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.repeat)return;const j=KM.indexOf(e.key.toLowerCase());if(j<0||kdown.has(j))return;kdown.add(j);noteOn(oct+j)});
addEventListener('keyup',e=>{const j=KM.indexOf(e.key.toLowerCase());if(j<0)return;kdown.delete(j);noteOff(oct+j)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(buildKb,150)});
buildKb();
</script>
